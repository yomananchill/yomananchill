<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="50" viewBox="0 0 1000 50" font-family='"JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace'>
<defs>
  <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#080b08"/><stop offset="1" stop-color="#0a0f0a"/>
  </linearGradient>
  <radialGradient id="vig" cx=".5" cy=".5" r=".75">
    <stop offset="0" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".55"/>
  </radialGradient>
  <radialGradient id="glow" cx=".5" cy=".42" r=".6">
    <stop offset="0" stop-color="#8ce39a" stop-opacity=".10"/><stop offset="1" stop-color="#8ce39a" stop-opacity="0"/>
  </radialGradient>
  <filter id="phos" x="-30%" y="-30%" width="160%" height="160%">
    <feGaussianBlur stdDeviation="1.4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="soft"><feGaussianBlur stdDeviation="5"/></filter>
  <pattern id="scan" width="3" height="3" patternUnits="userSpaceOnUse">
    <rect width="3" height="1" fill="#000" fill-opacity=".22"/>
  </pattern>
<linearGradient id="fade" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#0a0e0a"/><stop offset=".07" stop-color="#0a0e0a" stop-opacity="0"/><stop offset=".93" stop-color="#0a0e0a" stop-opacity="0"/><stop offset="1" stop-color="#0a0e0a"/></linearGradient><clipPath id="sc"><rect width="1000" height="50" rx="10"/></clipPath></defs>
<rect width="1000" height="50" rx="10" fill="#0a0e0a" stroke="#152418"/>
<g clip-path="url(#sc)">
<g font-size="13" fill="#5f8f6b" transform="translate(150,0)"><text x="0" y="30">Chromium // Wireshark // llama.cpp // Redis // LibreOffice // ClamAV // OpenThread // PowerShell // Protobuf // RE2 // Brotli // oFono //   Chromium // Wireshark // llama.cpp // Redis // LibreOffice // ClamAV // OpenThread // PowerShell // Protobuf // RE2 // Brotli // oFono //   <animateTransform attributeName="transform" type="translate" from="150,0" to="-942,0" dur="28s" repeatCount="indefinite"/></text></g>
<rect width="1000" height="50" fill="url(#fade)"/>
<rect x="0" y="0" width="132" height="50" fill="#0a0e0a"/>
<circle cx="20" cy="25" r="4" fill="#8ce39a"><animate attributeName="opacity" values="1;.2;1" dur="1.4s" repeatCount="indefinite"/></circle>
<text x="32" y="30" font-size="12" font-weight="700" letter-spacing="1" fill="#8ce39a">SCANNING</text>
<line x1="132" y1="11" x2="132" y2="39" stroke="#152418"/>
<rect width="1000" height="50" rx="10" fill="url(#scan)" pointer-events="none"/>
</g></svg>